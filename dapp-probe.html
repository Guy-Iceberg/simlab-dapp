<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>probe idle</title>
</head>
<body>
<h1 id="h">cross-origin probe (github.io)</h1>
<pre id="out"></pre>
<script>
var OUT=[];
function log(m){OUT.push(m);document.getElementById('out').textContent=OUT.join('\n');
  document.title='P:'+OUT.length+':'+m.slice(0,40).replace(/[^a-zA-Z0-9 ]/g,'');}
function probe(label,url,opts){
  return fetch(url,opts||{}).then(function(r){
    return r.text().then(function(t){log(label+' OK '+r.status+' acao='+(r.headers.get('access-control-allow-origin')||'none')+' body='+t.slice(0,40));});
  }).catch(function(e){log(label+' FAIL: '+e.message);});
}
log('START');
var rpcBody=JSON.stringify({jsonrpc:'2.0',id:1,method:'getHealth'});
probe('POST-tunnel','https://anytime-consolidation-chris-high.trycloudflare.com/',{method:'POST',headers:{'Content-Type':'application/json'},body:rpcBody});
probe('GET-tunnel','https://anytime-consolidation-chris-high.trycloudflare.com/dapp-swap.html');
probe('POST-mainnet','https://api.mainnet-beta.solana.com/',{method:'POST',headers:{'Content-Type':'application/json'},body:rpcBody});
probe('GET-own','https://guy-iceberg.github.io/simlab-dapp/web3.js');
run=null;
</script>
</body>
</html>
